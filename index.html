<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">

    <title>Pesquisa Culturama</title>
</head>

<body>
    <main>
        <header>
            <img src="img/logo-culturama.png" alt="Logo Culturama">
            <h1>Pesquisa de Opinião</h1>
        </header>
        <section>
            <form action="sucesso.html" method="post">
                
                <fieldset>

                    <legend>Dados Pesssoais</legend>
                    <label for="userName">Nome</label>
                    <input id="userName" type="text" name="userName" required>
                    <br>
                    <label for="userAge">Idade</label>
                    <input id="userAge" type="number" name="age" min="12" max="100" required>
                    <br>
                    <label for="userBirthDate">Data de Nascimento</label>
                    <input id="userBirthDate" type="date" name="userBirthDate">
                    <br>
                    <label for="userEmail">Email</label>
                    <input id="userEmail" type="email" name="userEmail">
                    <br>
                    <label for="userPhoneNumber">Telefone</label>
                    <input id="userPhoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="11111111111">
                    <br>
                    <label for="userImage">Upload de foto</label>
                    <input id="userImage" type="file" accept="image/*" name="userImage">
                    <br>

                </fieldset>

                <fieldset>
                    <legend>Perfil</legend>
                    <p>Gênero:</p>
                    <input id="Feminino" type="radio" name="userGender" value="Feminino">
                    <label for="Feminino">Feminino</label>

                    <input id="Masculino" type="radio" name="userGender" value="Masculino">
                    <label for="Masculino">Masculino</label>

                    <input id="notInformed" type="radio" name="userGender" value="notInformed">
                    <label for="notInformed">Prefiro não informar</label>
                    <br>
                    <label for="maritalStatus">Estado Civil:</label>
                    <select name="maritalStatus">

                        <option value="notInformed">Selecione...</option>
                        <option value="casado">Casado</option>
                        <option value="solteiro">Solteiro</option>
                        <option value="viuvo">Viúvo</option>
                        <option value="divorciado">Divorciado</option>
                        <option value="UniãoEstavel">União estável</option>
                    </select>

                    <label for="userState">Estado:</label>
                    <select name="userState" required>
                        <option value="acre">Acre </option>
                        <option value="alagoas">Alagoas </option>
                        <option value="amapa">Amapá </option>
                        <option value="amazonas">Amazonas </option>
                        <option value="bahia">Bahia </option>
                        <option value="ceara">Ceará </option>
                        <option value="distritoFederal">Distrito Federal </option>
                        <option value="espiritoSanto">Espirito Santo </option>
                        <option value="goias">Goiás </option>
                        <option value="maranhao">Maranhão </option>
                        <option value="matoGrossoDoSul">Mato Grosso do Sul </option>
                        <option value="matoGrosso">Mato Grosso </option>
                        <option value="minasGerais">Minas Gerais </option>
                        <option value="para">Pará </option>
                        <option value="paraiba">Paraíba </option>
                        <option value="parana">Paraná </option>
                        <option value="pernambuco">Pernambuco </option>
                        <option value="piaui">Piauí </option>
                        <option value="rioDeJaneiro">Rio de Janeiro </option>
                        <option value="rioGrandeDoNorte">Rio Grande do Norte </option>
                        <option value="rioGrandeDoSul">Rio Grande do Sul </option>
                        <option value="rondonia">Rondônia </option>
                        <option value="roraima">Roraima </option>
                        <option value="santaCatarina">Santa Catarina </option>
                        <option value="saoPaulo">São Paulo </option>
                        <option value="sergipe">Sergipe </option>
                        <option value="tocantins">Tocantins </option>
                    </select>
                </fieldset>
        

                <fieldset>

                    <legend>Hábitos</legend>
                    
                    <p>Redes Sociais</p>
                    <input id="instagram" type="checkbox" name="social" value="instagram">
                    <label for="instagram">Instagram</label>
                    <br>
                    <input id="facebook" type="checkbox" name="social" value="facebook">
                    <label for="facebook">Facebook</label>
                    <br>
                    <input id="linkedin" type="checkbox" name="social" value="linkedin">
                    <label for="linkedin">Linkedin</label>
                    <br>
                    <input id="tik-tok" type="checkbox" name="social" value="tik-tok">
                    <label for="tik-tok">Tik-Tok</label>

                    <br>
                    <label for="musicStyle">Estilo Musical</label>
                    <input list="styleTipes" type="text" name="userMusicStyle" id="musicStyle">
                    <datalist id="styleTipes">
                        <option value="rock">
                        <option value="samba">
                        <option value="pop">
                        <option value="metal">
                    </datalist>

                    <br>

                    <label for="favoriteColor">Cor favorita</label>
                    <input type="color" name="userFavoriteColor" id="favoriteColor">
                </fieldset>




                <fieldset>
                    <legend>Opinião</legend>

                    <p>De sua opinião sobre nossa pesquisa</p>

                    
                    <input id="otimo" type="radio" name="userOpnion" value="otimo">
                    <label for="otimo">Otímo</label>

                    <input id="bom" type="radio" name="userOpnion" value="bom">
                    <label for="bom">Bom</label>

                    <input id="regular" type="radio" name="userOpnion" value="regular">
                    <label for="regular">Regular</label>

                    <input id="ruim" type="radio" name="userOpnion" value="ruim">
                    <label for="ruim">ruim</label>

                    <br>

                    <p>Comentário:</p>
                    <textarea name="comment" id="userComment"></textarea>

                </fieldset>


                <fieldset>
                    <legend>Confirmações</legend>

                    <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="Confirmed" required>
                    <label for="userLgpdTerm">Eu aceito participar da Pesquisa</label>

                    <br>

                    <input type="checkbox" name="userGetResult" id="getResult" value="Confirmed">
                    <label for="userGetResult">Desejo receber resultado por e-mail</label>

                    
                    

                </fieldset>

                <button type="submit">
                    Enviar
                </button>
                <button type="reset">
                    Limpar
                </button>

            </form>
        </section>
    </main>
</body>

</html>
